<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FinLog - Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container">
    <!-- <h1>💸 FinLog</h1> -->
    <h1 style="
    background: linear-gradient(to right, #4f9271, #3b7065);
    color: white;
    padding: 20px 40px;
    border-radius: 15px;
    font-family: 'Segoe UI', sans-serif;
    font-size: 2.8rem;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    letter-spacing: 1px;
    text-align: center;
">
    💸 FinLog
</h1>

    <section>
        <h2>Total Expense: ₹{{ total_expense }}</h2>
    </section>

    <form method="POST" action="/">
        <label>Category:</label>
        <select name="filter_category">
            <option value="All" {% if selected_category == "All" %}selected{% endif %}>All</option>
            {% for category in categories %}
                <option value="{{ category }}" {% if selected_category == category %}selected{% endif %}>{{ category }}</option>
            {% endfor %}
        </select>

        <label>Start Date:</label>
        <input type="date" name="start_date" value="{{ start_date }}">

        <label>End Date:</label>
        <input type="date" name="end_date" value="{{ end_date }}">

        <label>Search Note:</label>
        <input type="text" name="search_note" value="{{ search_note }}">

        <button type="submit">Apply Filters</button>
    </form>

    <h3>All Expenses</h3>
    <table>
        <thead>
            <tr>
                <th>Category</th>
                <th>Note</th>
                <th>Amount</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody>
            {% for expense in expenses %}
            <tr>
                <td>{{ expense[2] }}</td>
                <td>{{ expense[3] }}</td>
                <td>₹{{ expense[1] }}</td>
                <td>{{ expense[4] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <h3>Spending by Category</h3>
    <canvas id="expenseChart" width="400" height="400"></canvas>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const ctx = document.getElementById('expenseChart').getContext('2d');
        new Chart(ctx, {
            type: 'pie',
            data: {
                labels: {{ chart_labels | tojson }},
                datasets: [{
                    data: {{ chart_data | tojson }},
                    backgroundColor: [
                        '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0',
                        '#9966FF', '#FF9F40', '#E7E9ED'
                    ]
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'bottom' }
                }
            }
        });
    });
</script>


    <a class="add-btn" href="{{ url_for('add_expense') }}">➕ Add New Expense</a>
</div>

<script>
    const ctx = document.getElementById('expenseChart').getContext('2d');
    const categoryChart = new Chart(ctx, {
        type: 'pie',
        data: {
            labels: {{ chart_labels | safe }},
            datasets: [{
                data: {{ chart_data | safe }},
                backgroundColor: [
                    '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0',
                    '#9966FF', '#FF9F40', '#E7E9ED'
                ]
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'bottom'
                }
            }
        }
    });
</script>
</body>
</html>
